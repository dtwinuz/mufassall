# A release pipeline with the alternative paths a real team has: retries, an allowed failure,
# a notification on failure, a manual production gate, a stop job and tag-only publishing.
stages: [build, test, deploy, notify]

build:
  stage: build
  script: [make build]
  retry: 2
  artifacts:
    paths: [out/]

unit:
  stage: test
  script: [make test]

lint:
  stage: test
  script: [make lint]
  allow_failure: true

deploy-staging:
  stage: deploy
  script: [./deploy.sh staging]
  environment:
    name: staging
    on_stop: stop-staging

stop-staging:
  stage: deploy
  script: [./undeploy.sh staging]
  when: manual
  environment:
    name: staging
    action: stop

deploy-production:
  stage: deploy
  needs: [deploy-staging]
  script: [./deploy.sh production]
  environment: production
  when: manual

publish-package:
  stage: deploy
  script: [make publish]
  rules:
    - if: $CI_COMMIT_TAG

notify-failure:
  stage: notify
  script: [./notify.sh "pipeline failed"]
  when: on_failure
