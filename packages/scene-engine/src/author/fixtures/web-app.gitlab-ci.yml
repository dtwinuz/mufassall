# A typical web service pipeline: build, test, package, deploy.
include:
  - local: ci/templates/security.yml
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - build
  - test
  - package
  - deploy

variables:
  NODE_VERSION: "20"

default:
  image: node:20-alpine
  cache:
    key: npm
    paths: [.npm/]

workflow:
  name: Web app pipeline
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.node-job: &node
  before_script:
    - npm ci --cache .npm
  tags: [docker]

.deploy-template:
  stage: deploy
  image: alpine:3.20
  script:
    - ./scripts/deploy.sh "$CI_ENVIRONMENT_NAME"

build-app:
  <<: *node
  stage: build
  script:
    - npm run build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

lint:
  <<: *node
  stage: test
  needs: []
  script:
    - npm run lint

unit-tests:
  <<: *node
  stage: test
  needs: [build-app]
  services:
    - name: postgres:16-alpine
      alias: db
  variables:
    POSTGRES_PASSWORD: example
  script:
    - npm test -- --coverage
  parallel: 3

e2e-tests:
  <<: *node
  stage: test
  script:
    - npm run e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true

docker-image:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  needs: [build-app, unit-tests]
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

deploy-staging:
  extends: .deploy-template
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - main

deploy-production:
  extends: .deploy-template
  needs: [deploy-staging]
  environment: production
  when: manual

docs-pipeline:
  stage: deploy
  needs: []
  trigger:
    include: docs/.gitlab-ci.yml
