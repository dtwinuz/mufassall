name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - run: npm run e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: ./deploy.sh

  release:
    needs: deploy
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - run: gh release create

  alert:
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: ./alert.sh
